name: Build and Release Custom APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    env:
      # Public updater coordinates. These are intentionally not GitHub secrets.
      GITHUB_OWNER: yasarozg
      GITHUB_REPO: ARVIO
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Prepare secrets.properties
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
          TRAKT_CLIENT_SECRET: ${{ secrets.TRAKT_CLIENT_SECRET }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          cp secrets.defaults.properties secrets.properties
          if [ -n "$TMDB_API_KEY" ]; then
            sed -i "s|^TMDB_API_KEY=.*|TMDB_API_KEY=$TMDB_API_KEY|" secrets.properties
          fi
          if [ -n "$TRAKT_CLIENT_ID" ]; then
            sed -i "s|^TRAKT_CLIENT_ID=.*|TRAKT_CLIENT_ID=$TRAKT_CLIENT_ID|" secrets.properties
          fi
          if [ -n "$TRAKT_CLIENT_SECRET" ]; then
            sed -i "s|^TRAKT_CLIENT_SECRET=.*|TRAKT_CLIENT_SECRET=$TRAKT_CLIENT_SECRET|" secrets.properties
          fi
          if [ -n "$TELEGRAM_API_ID" ]; then
            sed -i "s|^TELEGRAM_API_ID=.*|TELEGRAM_API_ID=$TELEGRAM_API_ID|" secrets.properties
          fi
          if [ -n "$TELEGRAM_API_HASH" ]; then
            sed -i "s|^TELEGRAM_API_HASH=.*|TELEGRAM_API_HASH=$TELEGRAM_API_HASH|" secrets.properties
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Validate release signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          : "${KEYSTORE_BASE64:?Missing KEYSTORE_BASE64 repository secret}"
          : "${KEYSTORE_PASSWORD:?Missing KEYSTORE_PASSWORD repository secret}"
          : "${KEY_ALIAS:?Missing KEY_ALIAS repository secret}"
          : "${KEY_PASSWORD:?Missing KEY_PASSWORD repository secret}"

      - name: Prepare production signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/arvio-release.keystore"
          printf '%s\n' \
            "storeFile=$GITHUB_WORKSPACE/arvio-release.keystore" \
            "storePassword=$KEYSTORE_PASSWORD" \
            "keyAlias=$KEY_ALIAS" \
            "keyPassword=$KEY_PASSWORD" \
            > keystore.properties

      - name: Build Release APK
        run: ./gradlew assembleSideloadRelease --no-daemon

      - name: Upload APK to Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: app/build/outputs/apk/sideload/release/*.apk
          generate_release_notes: true
