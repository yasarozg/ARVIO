name: Build and Release Custom APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    env:
      # Public updater coordinates. These are intentionally not GitHub secrets.
      GITHUB_OWNER: yasarozg
      GITHUB_REPO: ARVIO
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Prepare secrets.properties
        env:
          APP_ANON_KEY: ${{ secrets.APP_ANON_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
          TRAKT_CLIENT_SECRET: ${{ secrets.TRAKT_CLIENT_SECRET }}
          MDBLIST_CLIENT_ID: ${{ secrets.MDBLIST_CLIENT_ID }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          : "${APP_ANON_KEY:?Missing APP_ANON_KEY repository secret}"
          : "${SUPABASE_URL:?Missing SUPABASE_URL repository secret}"
          : "${TMDB_API_KEY:?Missing TMDB_API_KEY repository secret}"
          : "${TRAKT_CLIENT_ID:?Missing TRAKT_CLIENT_ID repository secret}"
          : "${TRAKT_CLIENT_SECRET:?Missing TRAKT_CLIENT_SECRET repository secret}"
          : "${MDBLIST_CLIENT_ID:?Missing MDBLIST_CLIENT_ID repository secret}"
          : "${TELEGRAM_API_ID:?Missing TELEGRAM_API_ID repository secret}"
          : "${TELEGRAM_API_HASH:?Missing TELEGRAM_API_HASH repository secret}"
          printf '%s\n' \
            "APP_ANON_KEY=$APP_ANON_KEY" \
            "SUPABASE_URL=$SUPABASE_URL" \
            "SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY:-$APP_ANON_KEY}" \
            "GOOGLE_WEB_CLIENT_ID=${GOOGLE_WEB_CLIENT_ID:-}" \
            "SENTRY_DSN=${SENTRY_DSN:-disabled}" \
            "TMDB_API_KEY=$TMDB_API_KEY" \
            "TRAKT_CLIENT_ID=$TRAKT_CLIENT_ID" \
            "TRAKT_CLIENT_SECRET=$TRAKT_CLIENT_SECRET" \
            "MDBLIST_CLIENT_ID=$MDBLIST_CLIENT_ID" \
            "TELEGRAM_API_ID=$TELEGRAM_API_ID" \
            "TELEGRAM_API_HASH=$TELEGRAM_API_HASH" \
            > secrets.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Derive Android version from release tag
        run: |
          version_name="${GITHUB_REF_NAME#v}"
          # Accept the patch tag form (v2.2.0) and the public release form
          # (v2.2), while keeping Android versionName stable at 2.2.
          case "$version_name" in
            *.0) version_name="${version_name%.0}" ;;
          esac
          if [ -z "$version_name" ]; then
            echo "Could not derive versionName from tag $GITHUB_REF_NAME" >&2
            exit 1
          fi
          echo "ARVIO_VERSION_NAME=$version_name" >> "$GITHUB_ENV"
          # 2.0.1 occupied the 318xxx range; 2.2 starts at 319xxx so every
          # release APK remains installable as an in-place update.
          echo "ARVIO_VERSION_CODE=$((319000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"

      - name: Validate release signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          : "${KEYSTORE_BASE64:?Missing KEYSTORE_BASE64 repository secret}"
          : "${KEYSTORE_PASSWORD:?Missing KEYSTORE_PASSWORD repository secret}"
          : "${KEY_ALIAS:?Missing KEY_ALIAS repository secret}"
          : "${KEY_PASSWORD:?Missing KEY_PASSWORD repository secret}"

      - name: Prepare production signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/arvio-release.keystore"
          printf '%s\n' \
            "storeFile=$GITHUB_WORKSPACE/arvio-release.keystore" \
            "storePassword=$KEYSTORE_PASSWORD" \
            "keyAlias=$KEY_ALIAS" \
            "keyPassword=$KEY_PASSWORD" \
            > keystore.properties

      - name: Build Release APK
        run: >-
          ./gradlew assembleSideloadRelease --no-daemon
          -ParvioVersionName="$ARVIO_VERSION_NAME"
          -ParvioVersionCode="$ARVIO_VERSION_CODE"

      - name: Upload APK to Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: app/build/outputs/apk/sideload/release/*.apk
          generate_release_notes: true
